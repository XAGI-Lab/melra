services:
  melra:
    build:
      context: .
    image: melra:local
    stdin_open: true
    # Reaps what a terminal job leaves behind; node as PID 1 does not.
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ./:/workspace
      - melra-data:/data
    environment:
      MELRA_WORKSPACE: /workspace
      MELRA_HOME: /data

volumes:
  melra-data:
