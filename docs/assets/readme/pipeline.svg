<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">The nine things MELRA does to every effect</title>
  <desc id="d">melra_plan types, classifies, authorises, issues an approval challenge for mutations, and records the task durably; nothing runs yet. melra_execute checks policy again, deduplicates by idempotency key, runs the adapter under a budget and cancel signal, verifies declared evidence, and writes a redacted receipt.</desc>
  <defs>
    <style>
      .num { font: 800 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .name { font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .q { font: italic 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
      .phase { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
      .note { font: 500 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
      .bracket { fill: none; stroke: #8c959f; stroke-width: 1.5; }
      .link { stroke: #d0d7de; stroke-width: 3; }
      .card { fill: #f6f8fa; stroke: #d0d7de; }
      .plan { fill: #2bb8a8; }
      .exec { fill: #3f6fe8; }
      .gate { fill: #f5a033; }
      @media (prefers-color-scheme: dark) {
        .name, .phase { fill: #e6edf3; }
        .q, .note { fill: #9198a1; }
        .bracket { stroke: #6e7681; }
        .link { stroke: #30363d; }
        .card { fill: #161b22; stroke: #30363d; }
      }
    </style>
  </defs>

  <!-- phase brackets -->
  <path class="bracket" d="M30 46 V36 H520 V46"/>
  <text class="phase" x="275" y="26" text-anchor="middle">melra_plan · nothing runs yet</text>
  <path class="bracket" d="M540 46 V36 H930 V46"/>
  <text class="phase" x="735" y="26" text-anchor="middle">melra_execute · policy checked again</text>

  <line class="link" x1="60" y1="92" x2="900" y2="92"/>

  <!-- 1..5 plan -->
  <g transform="translate(60 92)">
    <circle class="plan" r="22"/><text class="num" y="5" text-anchor="middle">1</text>
    <text class="name" y="48" text-anchor="middle">Type</text>
    <text class="q" y="68" text-anchor="middle">exactly what</text>
    <text class="q" y="84" text-anchor="middle">may change?</text>
  </g>
  <g transform="translate(165 92)">
    <circle class="plan" r="22"/><text class="num" y="5" text-anchor="middle">2</text>
    <text class="name" y="48" text-anchor="middle">Classify</text>
    <text class="q" y="68" text-anchor="middle">read, change,</text>
    <text class="q" y="84" text-anchor="middle">or destroy?</text>
  </g>
  <g transform="translate(270 92)">
    <circle class="plan" r="22"/><text class="num" y="5" text-anchor="middle">3</text>
    <text class="name" y="48" text-anchor="middle">Authorise</text>
    <text class="q" y="68" text-anchor="middle">does policy</text>
    <text class="q" y="84" text-anchor="middle">allow it?</text>
  </g>
  <g transform="translate(375 92)">
    <circle class="gate" r="22"/><text class="num" y="5" text-anchor="middle">4</text>
    <text class="name" y="48" text-anchor="middle">Approve</text>
    <text class="q" y="68" text-anchor="middle">exact phrase</text>
    <text class="q" y="84" text-anchor="middle">for changes</text>
  </g>
  <g transform="translate(480 92)">
    <circle class="plan" r="22"/><text class="num" y="5" text-anchor="middle">5</text>
    <text class="name" y="48" text-anchor="middle">Record</text>
    <text class="q" y="68" text-anchor="middle">durably, before</text>
    <text class="q" y="84" text-anchor="middle">anything runs</text>
  </g>

  <!-- 6..9 execute -->
  <g transform="translate(585 92)">
    <circle class="exec" r="22"/><text class="num" y="5" text-anchor="middle">6</text>
    <text class="name" y="48" text-anchor="middle">Dedupe</text>
    <text class="q" y="68" text-anchor="middle">already done?</text>
    <text class="q" y="84" text-anchor="middle">never twice</text>
  </g>
  <g transform="translate(690 92)">
    <circle class="exec" r="22"/><text class="num" y="5" text-anchor="middle">7</text>
    <text class="name" y="48" text-anchor="middle">Run</text>
    <text class="q" y="68" text-anchor="middle">under a budget</text>
    <text class="q" y="84" text-anchor="middle">and cancel</text>
  </g>
  <g transform="translate(795 92)">
    <circle class="exec" r="22"/><text class="num" y="5" text-anchor="middle">8</text>
    <text class="name" y="48" text-anchor="middle">Verify</text>
    <text class="q" y="68" text-anchor="middle">did it really</text>
    <text class="q" y="84" text-anchor="middle">work?</text>
  </g>
  <g transform="translate(900 92)">
    <circle class="exec" r="22"/><text class="num" y="5" text-anchor="middle">9</text>
    <text class="name" y="48" text-anchor="middle">Receipt</text>
    <text class="q" y="68" text-anchor="middle">redacted,</text>
    <text class="q" y="84" text-anchor="middle">hash-linked</text>
  </g>

  <!-- outcome strip -->
  <rect class="card" x="30" y="210" width="900" height="100" rx="12"/>
  <text class="name" x="54" y="240">The outcome is decided by evidence, not by "no error"</text>
  <circle cx="62" cy="266" r="6" fill="#1a7f37"/><text class="note" x="76" y="271"><tspan font-weight="700">verified_success</tspan> — it ran and every declared check passed</text>
  <circle class="gate" cx="62" cy="290" r="6"/><text class="note" x="76" y="295"><tspan font-weight="700">partial</tspan> — it ran, but the evidence did not hold</text>
  <circle cx="520" cy="266" r="6" fill="#d1242f"/><text class="note" x="534" y="271"><tspan font-weight="700">policy_blocked</tspan> — refused before anything ran</text>
  <circle cx="520" cy="290" r="6" fill="#8250df"/><text class="note" x="534" y="295"><tspan font-weight="700">recovery_required</tspan> — a change may have happened; look first</text>
</svg>
