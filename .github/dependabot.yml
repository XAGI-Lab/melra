version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"
      - dependency-name: vitest
        update-types:
          - "version-update:semver-major"
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: npm
    directory: /examples/frameworks
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      framework-examples:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # The image's Node line moves deliberately (#78), not to whatever is
      # newest: an odd or not-yet-LTS major is outside the CI matrix. Digest
      # and patch updates within the line still come through.
      - dependency-name: node
        update-types:
          - "version-update:semver-major"
