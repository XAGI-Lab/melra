name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 22
          - 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # os.tmpdir() is on C:, the runner's OS disk, where every test's SQLite
      # store and browser profile has stalled at once (#363). RUNNER_TEMP is on D:.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: pnpm check

  # The main matrix runs the Python SDK on 3.11 only, the floor `requires-python`
  # promises. This covers every newer CPython against a real stdio server, once,
  # on Linux: what varies here is the interpreter, not the OS.
  python-sdk:
    name: Python ${{ matrix.python }} SDK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      # The SDK test drives the built CLI over stdio.
      - run: pnpm build
      - run: uv run --project sdk-py --group dev pytest sdk-py
      # The wheel ships py.typed, which promises type-checkers a clean API.
      - run: uv run --project sdk-py --group dev --with pyright==1.1.414 pyright sdk-py/src

  durable-release-gates:
    name: Durable recovery and package gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e
      - run: pnpm --filter @melra/evals test -- durable-core.test.ts
      - run: pnpm --filter @melra/evals evaluate:durable-core -- --publishable
      - run: pnpm pack:check

  # The framework examples that run with no model and no API key, as a user
  # would run them: `melra` from PATH, the built CLI, over stdio, its tools
  # listed and melra_capabilities called. Each library at the exact version
  # examples/frameworks locks, never the workspace's. A snippet prints an
  # error result and exits 0, so each step fails unless MELRA's capabilities
  # came back.
  framework-examples:
    name: Framework examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: examples/frameworks
      - run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" --require-hashes -r examples/frameworks/requirements.txt
          uv venv "$RUNNER_TEMP/venv-frameworks"
          uv pip install --python "$RUNNER_TEMP/venv-frameworks/bin/python" --require-hashes -r examples/frameworks/requirements-frameworks.txt
      - run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/workspace"
          printf '#!/bin/sh\nexec node "%s/apps/cli/dist/bin.js" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/bin/melra"
          chmod +x "$RUNNER_TEMP/bin/melra"
      - name: MCP TypeScript SDK
        working-directory: ${{ runner.temp }}/workspace
        shell: bash
        run: |
          PATH="$RUNNER_TEMP/bin:$PATH" node "$GITHUB_WORKSPACE/examples/frameworks/mcp_sdk.ts" | tee "$RUNNER_TEMP/ts.out"
          grep -q '"product": "MELRA"' "$RUNNER_TEMP/ts.out"
      - name: MCP Python SDK
        working-directory: ${{ runner.temp }}/workspace
        shell: bash
        run: |
          PATH="$RUNNER_TEMP/bin:$PATH" "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/examples/frameworks/mcp_sdk.py" | tee "$RUNNER_TEMP/py.out"
          grep -q '"product": "MELRA"' "$RUNNER_TEMP/py.out"
      - name: Vercel AI SDK
        working-directory: ${{ runner.temp }}/workspace
        shell: bash
        run: |
          PATH="$RUNNER_TEMP/bin:$PATH" node "$GITHUB_WORKSPACE/examples/frameworks/vercel_ai_sdk.ts" --no-model | tee "$RUNNER_TEMP/vercel.out"
          grep -q '"product": "MELRA"' "$RUNNER_TEMP/vercel.out"
      - name: LangChain
        working-directory: ${{ runner.temp }}/workspace
        shell: bash
        run: |
          PATH="$RUNNER_TEMP/bin:$PATH" "$RUNNER_TEMP/venv-frameworks/bin/python" "$GITHUB_WORKSPACE/examples/frameworks/langchain_agent.py" --no-model | tee "$RUNNER_TEMP/langchain.out"
          grep -q '"product": "MELRA"' "$RUNNER_TEMP/langchain.out"
      - name: OpenAI Agents SDK
        working-directory: ${{ runner.temp }}/workspace
        shell: bash
        run: |
          PATH="$RUNNER_TEMP/bin:$PATH" "$RUNNER_TEMP/venv-frameworks/bin/python" "$GITHUB_WORKSPACE/examples/frameworks/openai_agents.py" --no-model | tee "$RUNNER_TEMP/openai-agents.out"
          grep -q '"product": "MELRA"' "$RUNNER_TEMP/openai-agents.out"

  # Developer mode runs every command in the per-command sandbox wherever one
  # works, and the ubuntu runners above have none, so there it starts without
  # one. Here bubblewrap is installed and let make user namespaces, which
  # Ubuntu 24.04's AppArmor refuses by default, as deploy-recipes.yml does, so
  # the suites' real-sandbox tests run against it (#470). bwrap runs once on
  # its own first, so a runner that cannot fails here instead of skipping them.
  bubblewrap:
    name: Sandbox suites under bubblewrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-net true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --workspace-concurrency=1 --filter @melra/terminal-runtime --filter @melra/server --filter @melra/cli test
