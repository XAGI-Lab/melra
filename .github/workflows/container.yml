name: Container

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "scripts/docker-smoke.mjs"
      - "scripts/compose-smoke.mjs"
      - "examples/deploy/compose/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "scripts/docker-smoke.mjs"
      - "scripts/compose-smoke.mjs"
      - "examples/deploy/compose/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build --tag melra:ci .
      - run: docker run --rm melra:ci doctor
      - run: pnpm docker:smoke
        env:
          MELRA_IMAGE: melra:ci
      # The container pair; its stand-in agent loads the SDK from this build.
      - run: pnpm build
      - run: pnpm compose:smoke
        env:
          MELRA_IMAGE: melra:ci
