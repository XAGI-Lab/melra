name: Repair release assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing prerelease tag with no assets (for example v0.3.0-alpha.14)
        required: true
        type: string

permissions:
  contents: read

# One repair at a time: two runs for one tag would both see no assets and both
# upload.
concurrency:
  group: repair-release-assets
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_sha: ${{ steps.validate.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the existing prerelease
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z0-9.-]+$ ]] || {
            echo "::error::expected a prerelease tag such as v0.3.0-alpha.14"
            exit 1
          }
          release="$(gh release view "${RELEASE_TAG}" --json tagName,isPrerelease,assets)"
          test "$(jq -r .tagName <<<"${release}")" = "${RELEASE_TAG}"
          test "$(jq -r .isPrerelease <<<"${release}")" = true
          test "$(jq '.assets | length' <<<"${release}")" = 0 || {
            echo "::error::the release already has assets; refusing to replace them"
            exit 1
          }
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${RELEASE_TAG}" --jq .sha)"
          echo "tag_sha=${tag_sha}" >> "${GITHUB_OUTPUT}"

  binaries:
    needs: validate
    uses: ./.github/workflows/single-executable.yml
    with:
      release: true
      ref: ${{ needs.validate.outputs.tag_sha }}
    permissions:
      contents: read

  attach-assets:
    needs: [validate, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Validate tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${version}"
      # The tag's tree builds the files, but a tag cut before #205 (alpha.14
      # among them) has no .github/actions, so the build steps come from this
      # workflow's own commit. Checked out after the tag (checkout cleans the
      # workspace), into a folder that is untracked there, so `git archive
      # HEAD` and the release/ globs never see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .repair-tools
          persist-credentials: false
          sparse-checkout: .github/actions/release-artifacts/
          sparse-checkout-cone-mode: false
      - uses: ./.repair-tools/.github/actions/release-artifacts
      - name: Verify release files
        shell: bash
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          version="$(node -p "require('./package.json').version")"
          for asset in \
            "release/melra-node-${version}.tar.gz" "release/melra-source-${version}.tar.gz" \
            "release/melra.spdx.json" "release/SHA256SUMS" \
            "release/melra-${version}-linux-x64" "release/melra-${version}-linux-arm64" \
            "release/melra-${version}-darwin-arm64" "release/melra-${version}-win-x64.exe"; do
            [ -f "${asset}" ] || { echo "::error::missing ${asset}"; exit 1; }
          done
          ls release/*.whl release/*.tar.gz >/dev/null
      - name: Attest release checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Attach files to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_TAG_SHA: ${{ needs.validate.outputs.tag_sha }}
        shell: bash
        run: |
          # The executables' pattern names their platforms: a bare melra-[0-9]*
          # also matches the Python sdist and wheel.
          assets=(release/*.tar.gz release/*.whl release/*.json release/melra-[0-9]*-{linux,darwin,win}-* release/SHA256SUMS)
          # A name listed twice fails the upload partway, and a release left with
          # some assets is one this workflow refuses to touch again.
          dupes="$(printf '%s\n' "${assets[@]##*/}" | sort | uniq -d)"
          [ -z "${dupes}" ] || { echo "::error::listed twice: ${dupes}"; exit 1; }
          release="$(gh release view "${RELEASE_TAG}" --json tagName,isPrerelease,assets)"
          test "$(jq -r .tagName <<<"${release}")" = "${RELEASE_TAG}"
          test "$(jq -r .isPrerelease <<<"${release}")" = true
          test "$(jq '.assets | length' <<<"${release}")" = 0 || {
            echo "::error::the release gained assets; refusing to replace them"
            exit 1
          }
          current_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${RELEASE_TAG}" --jq .sha)"
          test "${current_tag_sha}" = "${EXPECTED_TAG_SHA}" || {
            echo "::error::the release tag moved after validation; refusing to attach mismatched files"
            exit 1
          }
          gh release upload "${RELEASE_TAG}" "${assets[@]}"
          diff -u \
            <(printf '%s\n' "${assets[@]##*/}" | sort) \
            <(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)
