# Throwaway diagnostics for #107: run the browser-runtime test files in
# parallel on macos-latest, as they hang there, with Playwright's protocol log
# captured, so the last CDP command that never got an answer can be read.
# Lives only on this branch; delete the branch when #107 has its answer.
name: Diagnose macOS Chrome stall (#107)

on:
  push:
    branches:
      - claude/diag-macos-chrome-stall
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parallel-browser-tests:
    name: attempt ${{ matrix.attempt }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Straight to vitest, not through run-recursive (which sets its own
      # worker count), with file parallelism on and no CI retry, so a hang
      # stays a hang. The step's own timeout ends a run that never finishes.
      - name: browser-runtime tests, three files at once
        working-directory: packages/browser-runtime
        timeout-minutes: 15
        env:
          CI: ""
          VITEST_MAX_WORKERS: "3"
          DEBUG: pw:protocol,pw:browser
        run: |
          set +e
          pnpm exec vitest run --testTimeout=60000 --hookTimeout=60000 --reporter=verbose 2> protocol.log
          echo "vitest exit: $?"
          exit 0
      - name: keep the log
        if: always()
        run: gzip -9 packages/browser-runtime/protocol.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: protocol-log-attempt-${{ matrix.attempt }}
          path: packages/browser-runtime/protocol.log.gz
          retention-days: 7
