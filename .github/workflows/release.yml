name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.5.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm e2e
      - run: pnpm security:audit
      - run: pnpm evals
      - run: pnpm --filter @melra/evals evaluate:durable-core -- --publishable
      - run: pnpm pack:check
      - name: Validate tag and package versions
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
      - name: Build release artifacts
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release/node release/python
          pnpm deploy --filter @melra/cli --prod release/node
          cp LICENSE NOTICE README.md release/node/
          tar -C release/node -czf \
            "${GITHUB_WORKSPACE}/release/melra-node-${version}.tar.gz" .
          uv build sdk-py --out-dir release/python --no-create-gitignore
          mv release/python/* release/
          rmdir release/python
          git archive --format=tar.gz --prefix="melra-${version}/" \
            --output="release/melra-source-${version}.tar.gz" HEAD
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: release/node
          format: spdx-json
          output-file: release/melra.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create checksums
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" >> .npmrc
          npm whoami --registry=https://registry.npmjs.org/
          case "${GITHUB_REF_NAME}" in
            *-alpha*) tag=alpha ;;
            *-beta*)  tag=beta ;;
            *-rc*)    tag=rc ;;
            *)        tag=latest ;;
          esac
          # Publishing runs before the GitHub release is created. There is no
          # reliable pre-flight for this: a dry run never issues a PUT, so it
          # cannot detect a missing scope or a token without rights to one, and
          # the registry's org endpoints answer 403 for every scope a granular
          # token cannot read, existing or not. The publish itself is the only
          # honest check, so it runs first and a failure leaves no release behind.
          pnpm -r publish --tag "${tag}" --provenance --no-git-checks --access public
      - name: Point latest at this prerelease
        if: ${{ contains(github.ref_name, '-') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          # No stable release exists yet, so `latest` — what a bare
          # `npm install @melra/cli` resolves — otherwise stays on whichever
          # prerelease happened to publish untagged, and an end user following the
          # most obvious command installs a build several releases behind. Delete
          # this step at 1.0, where `latest` has to mean the stable line.
          version="$(node -p "require('./package.json').version")"
          node -e 'const fs=require("node:fs");for(const p of fs.globSync("{apps,packages}/*/package.json")){const m=JSON.parse(fs.readFileSync(p,"utf8"));if(!m.private)console.log(m.name)}' \
            | while read -r name; do
                npm dist-tag add "${name}@${version}" latest
              done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(release/*.tar.gz release/*.whl release/*.json release/SHA256SUMS)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Re-run after a later step failed: keep the release, refresh its assets.
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            prerelease=""
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag --generate-notes ${prerelease}
          fi

  # CI builds this repo from source on every supported platform, which proves the
  # source tree works and says nothing about the tarball an end user gets. This
  # job installs the build that was just published, on a machine that never saw
  # the repo, and drives it over real MCP stdio.
  installed:
    needs: artifacts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Only the smoke script. The thing under test comes from the registry,
          # so checking out more would let repo state stand in for the artifact.
          sparse-checkout: scripts/registry-smoke.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the published CLI
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The publish above returns before the package is readable everywhere.
          for attempt in 1 2 3 4 5 6; do
            npm view "@melra/cli@${version}" version && break
            echo "not visible yet (attempt ${attempt})"
            sleep 15
          done
          npm install -g "@melra/cli@${version}"
          # The MCP client for the smoke, unpinned: an end user's client is
          # whatever is current, so that is what the artifact should answer.
          npm install --no-save @modelcontextprotocol/sdk
      - name: melra doctor
        shell: bash
        run: melra doctor
      - name: MCP stdio smoke against the installed CLI
        shell: bash
        env:
          MELRA_EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          MELRA_EXPECTED_VERSION="${MELRA_EXPECTED_VERSION#v}" \
            node scripts/registry-smoke.mjs

  container:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: xagi-lab/melra
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:alpha
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
