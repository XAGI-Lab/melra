name: Single executable

# Builds `melra` with Node inside (#76) on each OS and runs it with only the
# system directories on PATH: version, doctor, and conformance, which spawns
# the binary again as its own MCP server. Not a release step yet; signing and
# notarization are still open on the issue.

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/build-sea.mjs"
      - "scripts/sea-smoke.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/single-executable.yml"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/build-sea.mjs"
      - "scripts/sea-smoke.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/single-executable.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.5.0
      # `--build-sea` with an ES module main needs Node 25+; the binary carries
      # whichever Node builds it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sea
      - run: node scripts/sea-smoke.mjs
