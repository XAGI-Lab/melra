# Builds every file a release attaches into release/, the single-executable
# binaries included, then its SBOM and SHA256SUMS. Shared by the tag release
# (release.yml) and its dry run (release-dry-run.yml), so the dry run builds
# exactly what a release would. Expects a checkout with full history, pnpm,
# Node, uv, an installed workspace, and this run's melra-binary-* artifacts.
name: Release artifacts
description: Build the release files, SBOM and SHA256SUMS into release/.
runs:
  using: composite
  steps:
    - name: Build release artifacts
      shell: bash
      run: |
        version="$(node -p "require('./package.json').version")"
        mkdir -p release/node release/python
        pnpm deploy --filter @melra/cli --prod release/node
        cp -R LICENSE LICENSES NOTICE README.md release/node/
        tar -C release/node -czf \
          "${GITHUB_WORKSPACE}/release/melra-node-${version}.tar.gz" .
        uv build sdk-py --out-dir release/python --no-create-gitignore
        mv release/python/* release/
        rmdir release/python
        git archive --format=tar.gz --prefix="melra-${version}/" \
          --output="release/melra-source-${version}.tar.gz" HEAD
    # Into release/ before the checksums, so SHA256SUMS and the attestation
    # cover the binaries too.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: melra-binary-*
        path: release
        merge-multiple: true
    - name: Generate SPDX SBOM
      uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: release/node
        format: spdx-json
        output-file: release/melra.spdx.json
        upload-artifact: false
        upload-release-assets: false
    - name: Create checksums
      shell: bash
      run: |
        cd release
        find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
          | sort -z | xargs -0 sha256sum > SHA256SUMS
