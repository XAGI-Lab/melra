[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "melra-browser-bench"
version = "0.1.0"
description = "Representative browser-agent benchmarks for MELRA."
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "melra",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
miniwob = ["browsergym-miniwob==0.14.3"]
webarena = ["webarena-verified==1.2.3"]

[dependency-groups]
test = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
melra-browser-bench = "melra_browser_bench.cli:main"

# `browsergym-core` pins `lxml<6.0.0`, but the XXE fix for CVE-2026-41066
# (GHSA-vfmq-68hx-4jfw — `iterparse()` and `ETCompatXMLParser()` resolve local
# file entities by default) only landed in 6.1.0. The upper bound is browsergym
# being cautious rather than a known incompatibility, so it is overridden rather
# than left vulnerable. `benchmark:browser:check` passes on 6.1.1; the MiniWoB
# and WebArena extras are not installed by that check, so if a future browsergym
# release does break on lxml 6 it will surface in a benchmark run, not in CI.
# `webarena-verified` pins `geopy==2.4.1`, which carries a ReDoS in
# `geopy.Point` parsing (GHSA-mhvh-fq92-pfmr, fixed in 2.5.0). 2.5.0 keeps
# the same API and dependency (`geographiclib<3`); like lxml above, a break would
# show in a WebArena run rather than in CI, which does not install that extra.
[tool.uv]
override-dependencies = ["lxml>=6.1.0", "geopy>=2.5.0"]

[tool.uv.sources]
melra = { path = "../../sdk-py" }

[tool.hatch.build.targets.wheel]
packages = ["src/melra_browser_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
