[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "melra"
version = "0.3.0a9"
description = "Python client SDK for MELRA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "XAGI Labs Private Limited" }]
dependencies = ["mcp==1.28.1"]

[project.urls]
Repository = "https://github.com/XAGI-Lab/melra"
Documentation = "https://github.com/XAGI-Lab/melra#readme"

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/melra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
